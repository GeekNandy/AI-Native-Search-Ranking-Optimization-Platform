                $ref: '#/components/schemas/Problem'
        '500':
          description: Unexpected server failure
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      description: Click must occur within the 24-hour window and arrive within one hour. Missing impression
        is 409. Several clicks do not multiply CTR labels.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Click'
