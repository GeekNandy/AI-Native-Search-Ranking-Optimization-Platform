openapi: 3.1.0
info:
  title: Search Ranking Platform
  version: 2.0.0
  description: Catalog, bounded search, attributed interactions, immutable data/model artifacts, deployment
    and experiments. Local service; administrative APIs require X-Admin-Token. Public routes do not verify
    end-user identity.
servers:
- url: http://127.0.0.1:8080
paths:
  /api/v1/ads:
    post:
      operationId: createAd
      summary: Create an ad catalog entry
      description: Generates a new UUID on each request. Validated strings are stripped of surrounding whitespace
        before storage. A failed or timed-out request may have an uncertain write outcome and must not be blindly
        retried.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAd'
      responses:
        '201':
          description: Ad persisted
          headers:
            Location:
              description: Relative URI of the created ad
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ad'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          description: Unsupported request content type
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
        '500':
          $ref: '#/components/responses/UnexpectedFailure'
  /api/v1/ads/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getAd
      summary: Retrieve an ad by its UUID
      responses:
        '200':
          description: Ad found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ad'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Ad not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
        '500':
          $ref: '#/components/responses/UnexpectedFailure'
  /actuator/health:
    get:
      operationId: aggregateHealth
      summary: Aggregate configured health contributors
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
        '503':
          $ref: '#/components/responses/Unhealthy'
  /actuator/health/liveness:
    get:
      operationId: liveness
      summary: Application liveness independent of database connectivity
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
        '503':
          $ref: '#/components/responses/Unhealthy'
  /actuator/health/readiness:
    get:
      operationId: readiness
      summary: Readiness state and database connectivity
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
        '503':
          $ref: '#/components/responses/Unhealthy'
  /api/v1/search:
    post:
      operationId: search
      summary: Retrieve and rank bounded candidates
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: Invalid request or contract
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Referenced resource not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Identity, payload, or deployment revision conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Quality gate or supported size bound failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Database operation could not be confirmed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Unexpected server failure
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      description: Creates a new request identity each time; does not record an exposure. A stopped experiment
        explicitly falls back to baseline. Score is a probability only when policy is model.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
  /api/v1/events/impressions:
    post:
      operationId: recordImpression
      summary: Record an observed returned item
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '400':
          description: Invalid request or contract
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Referenced resource not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Identity, payload, or deployment revision conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Quality gate or supported size bound failed
