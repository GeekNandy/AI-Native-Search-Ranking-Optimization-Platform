components:
  schemas:
    CreateAd:
      type: object
      additionalProperties: false
      required:
      - title
      - category
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Length is measured in Unicode code points before whitespace stripping. Blank values
            and Unicode control characters are rejected.
          examples:
          - Camera
        category:
          type: string
          minLength: 1
          maxLength: 64
          description: Free-form category with preserved case. Blank values and Unicode control characters
            are rejected. Surrounding whitespace is stripped.
          examples:
          - Electronics
    Ad:
      type: object
      required:
      - id
      - title
      - category
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        category:
          type: string
          minLength: 1
          maxLength: 64
        createdAt:
          type: string
          format: date-time
          description: Server-generated UTC timestamp, at most microsecond precision
    Problem:
      type: object
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        errors:
          type: array
          items:
            type: object
            required:
            - field
            - message
            properties:
              field:
                type: string
              message:
                type: string
    Health:
      type: object
      required:
      - status
      properties:
        status:
          type: string
        groups:
          type: array
          items:
            type: string
    SearchRequest:
      type: object
      additionalProperties: false
      required:
      - query
      - userId
      - limit
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 120
        userId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        limit:
          type: integer
          minimum: 1
          maximum: 50
        experimentId:
          anyOf:
          - type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$
          - type: 'null'
    RankedItem:
      type: object
      additionalProperties: false
      required:
      - adId
      - title
      - category
      - position
      - score
      properties:
        adId:
          type: string
          format: uuid
        title:
          type: string
        category:
          type: string
        position:
          type: integer
          minimum: 1
          maximum: 50
        score:
          type: number
          minimum: 0
          maximum: 1.25
    SearchResponse:
      type: object
      additionalProperties: false
      required:
      - requestId
      - createdAt
      - policy
      - modelVersion
      - snapshotId
      - experimentId
      - arm
      - fallbackReason
      - items
      properties:
        requestId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        policy:
          type: string
          enum:
          - baseline
          - model
        modelVersion:
          anyOf:
          - type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$
          - type: 'null'
        snapshotId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        experimentId:
          anyOf:
          - type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$
          - type: 'null'
        arm:
          anyOf:
          - type: string
            enum:
            - control
            - treatment
          - type: 'null'
        fallbackReason:
          anyOf:
          - type: string
          - type: 'null'
        items:
          type: array
          items:
            $ref: '#/components/schemas/RankedItem'
          maxItems: 50
    Impression:
      type: object
      additionalProperties: false
      required:
      - id
      - requestId
      - adId
      - occurredAt
      properties:
        id:
          type: string
          format: uuid
        requestId:
          type: string
          format: uuid
        adId:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
    Click:
      type: object
      additionalProperties: false
      required:
      - id
      - impressionId
      - occurredAt
      properties:
        id:
          type: string
          format: uuid
        impressionId:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
    Receipt:
      type: object
      additionalProperties: false
      required:
      - id
      - created
      properties:
        id:
          type: string
          format: uuid
        created:
          type: boolean
    FeatureCounts:
      type: object
      additionalProperties: false
      required:
      - adId
      - impressions
      - clickedImpressions
      properties:
        adId:
          type: string
          format: uuid
        impressions:
          type: integer
          minimum: 0
          maximum: 1000000000000
        clickedImpressions:
          type: integer
          minimum: 0
          maximum: 1000000000000
          description: Must not exceed impressions.
    FeaturePublication:
      type: object
      additionalProperties: false
      required:
      - id
      - schemaVersion
      - windowStart
      - cutoff
      - sourceId
      - rows
      properties:
        id:
          type: string
          format: uuid
        schemaVersion:
          type: string
          enum:
          - click-v1
        windowStart:
          type: string
          format: date-time
        cutoff:
          type: string
          format: date-time
        sourceId:
          type: string
          minLength: 1
          maxLength: 128
        rows:
          type: array
          items:
            $ref: '#/components/schemas/FeatureCounts'
          maxItems: 10000
    FeatureSnapshot:
      type: object
      additionalProperties: false
      required:
      - id
      - cutoff
      - availableAt
      properties:
        id:
          type: string
          format: uuid
        cutoff:
          type: string
          format: date-time
        availableAt:
          type: string
          format: date-time
    ClickModel:
      type: object
      additionalProperties: false
      required:
      - version
      - schemaVersion
      - featureNames
      - means
      - scales
      - coefficients
      - intercept
      - trainedThrough
      - validationThrough
      - evaluationAsOf
      - trainingRows
      - validationRows
      - testRows
      - validationLogLoss
      - baselineValidationLogLoss
      - testLogLoss
      - baselineTestLogLoss
      - testBrierScore
      - sourceId
      properties:
        version:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$
        schemaVersion:
          type: string
          enum:
          - click-v1
        featureNames:
          type: array
          minItems: 3
          maxItems: 3
          prefixItems:
          - const: textRelevance
          - const: smoothedCtr
          - const: logImpressions
        means:
          type: array
          items:
            type: number
            minimum: -1000000
            maximum: 1000000
          minItems: 3
          maxItems: 3
        scales:
          type: array
          items:
            type: number
            minimum: 1.0e-12
            maximum: 1000000
          minItems: 3
          maxItems: 3
        coefficients:
          type: array
          items:
            type: number
            minimum: -1000000
            maximum: 1000000
          minItems: 3
          maxItems: 3
        intercept:
          type: number
          minimum: -1000000
          maximum: 1000000
        trainedThrough:
          type: string
          format: date-time
        validationThrough:
          type: string
          format: date-time
        evaluationAsOf:
          type: string
          format: date-time
        trainingRows:
          type: integer
          minimum: 2
        validationRows:
          type: integer
          minimum: 2
        testRows:
          type: integer
          minimum: 2
        validationLogLoss:
          type: number
          minimum: 0
          maximum: 100
        baselineValidationLogLoss:
          type: number
          minimum: 0
          maximum: 100
        testLogLoss:
          type: number
          minimum: 0
          maximum: 100
        baselineTestLogLoss:
          type: number
          minimum: 0
          maximum: 100
        testBrierScore:
          type: number
          minimum: 0
          maximum: 1
        sourceId:
          type: string
          minLength: 1
          maxLength: 128
    ModelRegistration:
      type: object
      additionalProperties: false
      required:
      - version
      - created
      - promotionEligible
      properties:
        version:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$
        created:
          type: boolean
        promotionEligible:
          type: boolean
    Deployment:
      type: object
      additionalProperties: false
      required:
      - revision
      - modelVersion
      - rolloutPercent
      properties:
        revision:
          type: integer
          minimum: 0
        modelVersion:
          anyOf:
          - type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$
          - type: 'null'
        rolloutPercent:
          type: integer
          minimum: 0
          maximum: 100
    Experiment:
      type: object
      additionalProperties: false
      required:
      - id
      - salt
      - modelVersion
      - treatmentPercent
      properties:
        id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$
        salt:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$
        modelVersion:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$
        treatmentPercent:
          type: integer
          minimum: 10
          maximum: 90
    ExperimentRegistration:
      type: object
      additionalProperties: false
      required:
      - id
      - created
      properties:
        id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$
        created:
          type: boolean
    ExperimentStop:
      type: object
      additionalProperties: false
      required:
      - id
      - stopped
      properties:
        id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$
        stopped:
          type: boolean
    ExperimentArm:
      type: object
      additionalProperties: false
      required:
      - users
      - convertedUsers
      - rate
      - lower95
      - upper95
      properties:
        users:
          type: integer
          minimum: 0
        convertedUsers:
          type: integer
          minimum: 0
        rate:
          anyOf:
          - type: number
            minimum: 0
            maximum: 1
          - type: 'null'
        lower95:
          anyOf:
          - type: number
            minimum: 0
            maximum: 1
          - type: 'null'
        upper95:
          anyOf:
          - type: number
            minimum: 0
            maximum: 1
          - type: 'null'
    ExperimentComparison:
      type: object
      additionalProperties: false
      required:
      - control
      - treatment
      - absoluteLift
      - liftLower95
      - liftUpper95
      - allocationChiSquare
      - sampleRatioMismatch
      - smallSample
      properties:
        control:
          $ref: '#/components/schemas/ExperimentArm'
        treatment:
          $ref: '#/components/schemas/ExperimentArm'
        absoluteLift:
          anyOf:
          - type: number
            minimum: -1
            maximum: 1
          - type: 'null'
        liftLower95:
          anyOf:
          - type: number
            minimum: -1
            maximum: 1
          - type: 'null'
        liftUpper95:
          anyOf:
          - type: number
            minimum: -1
            maximum: 1
          - type: 'null'
        allocationChiSquare:
          type: number
          minimum: 0
        sampleRatioMismatch:
          type: boolean
        smallSample:
          type: boolean
    ExperimentReport:
      type: object
      additionalProperties: false
      required:
      - experimentId
      - asOf
      - metric
      - followUpHours
      - active
      - comparison
      properties:
        experimentId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$
        asOf:
          type: string
          format: date-time
        metric:
          type: string
        followUpHours:
          type: integer
          enum:
          - 24
        active:
          type: boolean
        comparison:
          $ref: '#/components/schemas/ExperimentComparison'
    TrainingRow:
      type: object
      additionalProperties: false
      required:
      - impressionId
      - requestId
      - adId
      - predictionTime
      - impressionTime
      - labelAvailableAt
      - schemaVersion
      - textRelevance
      - smoothedCtr
      - logImpressions
      - label
      properties:
        impressionId:
          type: string
          format: uuid
        requestId:
          type: string
          format: uuid
        adId:
          type: string
          format: uuid
        predictionTime:
          type: string
          format: date-time
        impressionTime:
          type: string
          format: date-time
        labelAvailableAt:
          type: string
          format: date-time
        schemaVersion:
          type: string
          enum:
          - click-v1
        textRelevance:
          type: number
          minimum: 0
          maximum: 1
        smoothedCtr:
          type: number
          minimum: 0
          maximum: 1
        logImpressions:
          type: number
          minimum: 0
        label:
          type: integer
          enum:
          - 0
          - 1
    TrainingPage:
      type: object
      additionalProperties: false
      required:
      - asOf
      - rows
      - nextAfter
      properties:
        asOf:
          type: string
          format: date-time
        rows:
          type: array
          items:
            $ref: '#/components/schemas/TrainingRow'
          maxItems: 5000
        nextAfter:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
    ExportRequest:
      type: object
      additionalProperties: false
      required:
      - id
      - asOf
      properties:
        id:
          type: string
          format: uuid
        asOf:
          type: string
          format: date-time
    ExportReceipt:
      type: object
      additionalProperties: false
      required:
      - id
      - asOf
      - rows
      - created
      properties:
        id:
          type: string
          format: uuid
        asOf:
          type: string
          format: date-time
        rows:
          type: integer
          minimum: 0
          maximum: 100000
        created:
          type: boolean
    Ctr:
      type: object
      additionalProperties: false
      required:
      - adId
      - impressions
      - clickedImpressions
      - ctr
      properties:
        adId:
          type: string
          format: uuid
        impressions:
          type: integer
          minimum: 1
        clickedImpressions:
          type: integer
          minimum: 0
        ctr:
          type: number
          minimum: 0
          maximum: 1
    ModelQuality:
      type: object
      additionalProperties: false
      required:
      - modelVersion
      - impressions
      - logLoss
      - brierScore
      - ctr
      properties:
        modelVersion:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$
        impressions:
          type: integer
          minimum: 1
        logLoss:
          type: number
          minimum: 0
        brierScore:
          type: number
          minimum: 0
          maximum: 1
        ctr:
          type: number
          minimum: 0
          maximum: 1
  responses:
    BadRequest:
      description: Invalid JSON, invalid fields, or invalid UUID
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    DatabaseUnavailable:
      description: Database operation could not be confirmed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnexpectedFailure:
      description: Unexpected server failure with a generic public message
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Healthy:
      description: Health contributors are UP
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Health'
    Unhealthy:
      description: Health contributors report DOWN or OUT_OF_SERVICE
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Health'
  securitySchemes:
    AdminToken:
      type: apiKey
      in: header
      name: X-Admin-Token
      description: Configured token of at least 32 characters. Administrative routes are disabled otherwise.
