        '503':
          description: Database operation could not be confirmed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Unexpected server failure
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      description: One exposure per request/ad. Identical ID and payload retry is 200; conflicting identity/content
        is 409. New exposure must arrive within one hour and occur in the hour after search.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Impression'
  /api/v1/events/clicks:
