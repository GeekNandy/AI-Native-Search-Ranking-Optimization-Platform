spring.application.name=AI-Native Search Ranking Optimization Platform

server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/search_ranking}
spring.datasource.username=${DB_USERNAME:search_ranking}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.data-source-properties.connectTimeout=3
spring.datasource.hikari.data-source-properties.socketTimeout=5
spring.jdbc.template.query-timeout=5s

spring.flyway.clean-disabled=true
spring.mvc.problemdetails.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-trailing-tokens=true

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Administrative APIs and metrics are disabled until a token of at least 32 characters is configured.
platform.admin-token=${ADMIN_TOKEN:}
